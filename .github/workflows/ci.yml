name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l ./internal ./cmd)" || { gofmt -l ./internal ./cmd; exit 1; }
      - run: go vet ./...
      # Postgres real via testcontainers: o runner do GitHub ja tem Docker.
      - run: go test ./... -count=1 -timeout 30m

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint src
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target fonteca -t fonteca:ci .
      - run: docker build --target web -t fonteca-web:ci .
